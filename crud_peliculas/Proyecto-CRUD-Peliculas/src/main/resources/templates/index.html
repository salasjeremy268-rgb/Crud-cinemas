<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD Películas</title>
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <span class="navbar-brand fw-bold">
            <i class="bi bi-film"></i> Gestor de Películas
        </span>
    </div>
</nav>

<div class="container mt-4">

    <!-- FORMULARIO: Crear / Editar -->
    <div class="card shadow-sm mb-4">
        <div class="card-header bg-dark text-white fw-bold">
            <i class="bi bi-pencil-square"></i>
            <!-- Cambia el título si es edición -->
            <span th:text="${pelicula.id != null} ? 'Editar Película' : 'Nueva Película'">Nueva Película</span>
        </div>
        <div class="card-body">

            <form th:action="${pelicula.id != null} ? @{/guardar} : @{/guardar}"
                  method="post">

                <!-- Campo oculto para el ID (necesario para actualizar) -->
                <input type="hidden" name="id" th:value="${pelicula.id}">

                <div class="row g-3">

                    <div class="col-md-6">
                        <label class="form-label">Título</label>
                        <input type="text" name="titulo" class="form-control"
                               th:value="${pelicula.titulo}" placeholder="Ej: El Padrino" required>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Director</label>
                        <input type="text" name="director" class="form-control"
                               th:value="${pelicula.director}" placeholder="Ej: Francis Ford Coppola" required>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">Género</label>
                        <select name="genero" class="form-select">
                            <option value="">-- Seleccionar --</option>
                            <option value="Acción"      th:selected="${pelicula.genero == 'Acción'}">Acción</option>
                            <option value="Comedia"     th:selected="${pelicula.genero == 'Comedia'}">Comedia</option>
                            <option value="Drama"       th:selected="${pelicula.genero == 'Drama'}">Drama</option>
                            <option value="Terror"      th:selected="${pelicula.genero == 'Terror'}">Terror</option>
                            <option value="Ciencia Ficción" th:selected="${pelicula.genero == 'Ciencia Ficción'}">Ciencia Ficción</option>
                            <option value="Animación"   th:selected="${pelicula.genero == 'Animación'}">Animación</option>
                            <option value="Thriller"    th:selected="${pelicula.genero == 'Thriller'}">Thriller</option>
                            <option value="Romance"     th:selected="${pelicula.genero == 'Romance'}">Romance</option>
                        </select>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">Año</label>
                        <input type="number" name="anio" class="form-control"
                               th:value="${pelicula.anio}" placeholder="Ej: 1994" min="1888" max="2099" required>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">Calificación (0 - 10)</label>
                        <input type="number" name="calificacion" class="form-control"
                               th:value="${pelicula.calificacion}" placeholder="Ej: 9.2"
                               step="0.1" min="0" max="10" required>
                    </div>

                </div><!-- /row -->

                <div class="mt-3 d-flex gap-2">
                    <button type="submit" class="btn btn-success">
                        <i class="bi bi-save"></i>
                        <span th:text="${pelicula.id != null} ? 'Actualizar' : 'Guardar'">Guardar</span>
                    </button>
                    <a href="/" class="btn btn-secondary" th:if="${pelicula.id != null}">
                        <i class="bi bi-x-circle"></i> Cancelar
                    </a>
                </div>

            </form>
        </div>
    </div><!-- /card formulario -->

    <!-- TABLA: Listado de películas -->
    <div class="card shadow-sm">
        <div class="card-header bg-dark text-white fw-bold">
            <i class="bi bi-table"></i> Listado de Películas
        </div>
        <div class="card-body p-0">
            <table class="table table-bordered table-striped table-hover mb-0">
                <thead class="table-secondary">
                    <tr>
                        <th>ID</th>
                        <th>Título</th>
                        <th>Director</th>
                        <th>Género</th>
                        <th>Año</th>
                        <th>Calificación</th>
                        <th class="text-center">Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="p : ${lista}">
                        <td th:text="${p.id}"></td>
                        <td th:text="${p.titulo}"></td>
                        <td th:text="${p.director}"></td>
                        <td th:text="${p.genero}"></td>
                        <td th:text="${p.anio}"></td>
                        <td>
                            <span class="badge bg-warning text-dark"
                                  th:text="${p.calificacion} + ' / 10'"></span>
                        </td>
                        <td class="text-center">
                            <!-- Botón Editar -->
                            <a th:href="@{/editar/{id}(id=${p.id})}"
                               class="btn btn-warning btn-sm me-1">
                                <i class="bi bi-pencil"></i> Editar
                            </a>
                            <!-- Botón Eliminar -->
                            <a th:href="@{/eliminar/{id}(id=${p.id})}"
                               class="btn btn-danger btn-sm"
                               onclick="return confirm('¿Seguro que deseas eliminar esta película?')">
                                <i class="bi bi-trash"></i> Eliminar
                            </a>
                        </td>
                    </tr>
                    <!-- Mensaje si no hay registros -->
                    <tr th:if="${#lists.isEmpty(lista)}">
                        <td colspan="7" class="text-center text-muted py-4">
                            No hay películas registradas aún.
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div><!-- /card tabla -->

    <footer class="text-center text-muted mt-4 mb-3">
        <small>CRUD Películas &mdash; Spring Boot + Thymeleaf + Bootstrap 5</small>
    </footer>

</div><!-- /container -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
